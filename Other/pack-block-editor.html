<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pack Block Editor</title>
<style>
  :root {
    --board: #e6f0ff;
    --ink: #575e75;
    --muted: #7a8499;
    --line: #d0d8e6;
    --white: #fff;
    --notch-x: 18px;
    --notch-w: 26px;
    --notch-h: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--board); color: var(--ink); font-family: Helvetica, Arial, sans-serif; }
  button, select, input { font: inherit; }
  button, [role="button"] { cursor: pointer; }
  header { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; background: var(--white); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 14px; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }
  .mark { width: 32px; height: 32px; border-radius: 6px; background: #ffbf00; color: #fff; font-weight: 900; display: grid; place-items: center; flex-shrink: 0; }
  .grow { flex: 1; min-width: 0; }
  .grow p, .grow h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flag { height: 32px; border: 0; border-radius: 999px; background: #4cbf56; color: #fff; font-weight: 700; padding: 0 12px; }
  .flag.blue { background: #4c97ff; }
  .flag.gray { background: #7a8499; }
  .trash { min-width: 88px; height: 32px; border: 2px dashed var(--line); border-radius: 8px; background: #f6f8fc; color: var(--muted); font-weight: 700; font-size: 12px; display: grid; place-items: center; }
  .trash.drop-on { border-color: #ff6680; background: #ffe6eb; color: #ff6680; }
  .tabs { display: none; background: var(--white); border-bottom: 1px solid var(--line); }
  .tabs button { height: 44px; flex: 1; border: 0; background: transparent; font-weight: 700; color: var(--muted); }
  .tabs button.on { color: #4c97ff; }
  .app { display: grid; height: calc(100% - 48px); grid-template-columns: 72px 250px minmax(0, 1fr) 300px; min-height: 0; }
  nav.cats { background: var(--white); padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
  .sb-cat { display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: center; color: #fff; border: 0; border-radius: 6px; font-size: 10px; font-weight: 700; }
  .sb-cat.on { outline: 3px solid rgba(255,255,255,.9); outline-offset: -5px; }
  aside.fly, aside.code { background: var(--white); min-height: 0; overflow: auto; }
  aside.fly { --behind: var(--white); border-right: 1px solid #d6e2f2; padding: 12px 12px 20px; display: flex; flex-direction: column; gap: 12px; }
  aside.code { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  aside.code p { margin: 0; padding: 8px 12px; border-bottom: 1px solid #e6ebf2; font-size: 12px; font-weight: 700; color: var(--muted); }
  pre { margin: 0; padding: 12px; overflow: auto; font: 11px/1.45 ui-monospace, monospace; color: #394056; white-space: pre-wrap; }
  main { --behind: var(--board); position: relative; min-height: 0; overflow: auto; background-color: var(--board); background-image: radial-gradient(#c5d6ee 1.2px, transparent 1.2px); background-size: 20px 20px; }
  main.drop-on { outline: 3px dashed #4c97ff; outline-offset: -8px; }
  .scripts { position: relative; min-width: 100%; min-height: 100%; }
  .hint { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0; }
  .sb {
    --sb: #4c97ff;
    position: relative;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 6px;
    width: max-content;
    min-width: 168px;
    min-height: 40px;
    margin: 0;
    padding: 8px 14px 10px 10px;
    color: #fff;
    background: var(--sb);
    border: 0;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    text-align: left;
    white-space: nowrap;
    box-shadow: none;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .sb:active { cursor: grabbing; }
  .sb::after {
    content: "";
    position: absolute;
    left: var(--notch-x);
    bottom: calc(-1 * var(--notch-h) + 1px);
    width: var(--notch-w);
    height: var(--notch-h);
    background: var(--sb);
    border-radius: 0 0 6px 6px;
    z-index: 3;
  }
  .sb-stack { margin-top: calc(-1 * var(--notch-h)); padding-top: 12px; }
  .sb-stack::before {
    content: "";
    position: absolute;
    left: var(--notch-x);
    top: 0;
    width: var(--notch-w);
    height: var(--notch-h);
    background: var(--behind, var(--board));
    border-radius: 0 0 6px 6px;
    z-index: 4;
  }
  .sb-hat { margin-top: 0; padding: 12px 12px 10px; border-radius: 16px 16px 4px 4px; flex-direction: column; align-items: stretch; flex-wrap: nowrap; max-width: 520px; gap: 6px; white-space: normal; }
  .hat-title, .hat-values { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .hat-values { padding: 4px; background: rgba(0,0,0,.16); border-radius: 12px; }
  .sb-c { display: flex; flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 0; padding: 8px 8px 0; white-space: normal; width: auto; }
  .sb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 28px; padding: 0 6px 6px 2px; white-space: normal; }
  .sb-mouth {
    --behind: color-mix(in srgb, var(--sb) 68%, #000);
    min-height: 36px;
    margin: 0 2px 0 14px;
    padding: 8px 6px 8px 8px;
    background: var(--behind);
    border-radius: 0 8px 8px 0;
  }
  .sb-foot { height: 14px; margin: 4px -8px 0; background: var(--sb); border-radius: 0 0 4px 4px; }
  .sb input, .sb select { height: 22px; max-width: 148px; padding: 0 8px; color: var(--ink); background: #fff; border: 0; border-radius: 11px; font-size: 12px; font-weight: 700; cursor: text; touch-action: auto; }
  .sb input.num { width: 52px; max-width: 52px; padding: 0 6px; text-align: center; }
  .sb input.cmp { width: 92px; max-width: 110px; }
  .wide { max-width: 180px !important; }
  .sb-x { margin-left: auto; width: 18px; height: 18px; color: #fff; background: rgba(0,0,0,.18); border: 0; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
  .script { position: absolute; display: flex; flex-direction: column; align-items: flex-start; min-width: 220px; padding: 0; cursor: grab; filter: drop-shadow(0 3px 0 rgba(0,0,0,.16)); }
  .sb-mouth > .sb-stack:first-child { margin-top: 0; }
  .script:active { cursor: grabbing; }
  .script.drop-on { outline: 3px solid #4c97ff; outline-offset: 6px; }
  .script.dragging { opacity: .55; pointer-events: none; }
  .fly .sb { cursor: grab; margin: 4px 0 8px; }
  .fly .sb-stack { margin-top: 4px; }
  .empty { margin: 8px; color: #fff; font-size: 12px; font-weight: 700; opacity: .85; }
  .drop-slot { height: 6px; margin: 0 10px; border-radius: 6px; }
  body.is-dragging .drop-slot { height: 14px; background: rgba(76,151,255,.18); }
  body.is-dragging .sb input, body.is-dragging .sb select, body.is-dragging .sb-x { pointer-events: none; }
  .drop-slot.drop-on, .sb.drop-on, .sb-mouth.drop-on { background: #ffd500; outline: 2px solid #ffbf00; }
  .sb.drop-on { filter: brightness(1.08); }
  .sb.dragging { opacity: .4; pointer-events: none; }
  .ghost { position: fixed; pointer-events: none; z-index: 80; opacity: .92; margin: 0; max-width: 380px; box-shadow: 0 10px 22px rgba(0,0,0,.28); }
  .script.off-stack { filter: grayscale(1); opacity: .72; }
  .script.off-stack::after { content: "not on a stack"; display: block; margin: 4px 0 0 8px; color: #6d768c; font-size: 11px; font-weight: 700; }
  .reporter {
    display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 0 10px;
    border-radius: 999px; background: #ff8c1a; color: #fff; font-size: 12px; font-weight: 700;
    cursor: grab; user-select: none; touch-action: none; box-shadow: 0 2px 0 rgba(0,0,0,.18);
  }
  .reporter:active { cursor: grabbing; }
  .reporter.dragging { opacity: .4; pointer-events: none; }
  .reporter.bad { filter: grayscale(1); opacity: .5; }
  .reporter.math { background: #59c059; }
  .socket {
    display: inline-flex; align-items: center; min-height: 26px; min-width: 36px; padding: 2px;
    border-radius: 999px; background: rgba(0,0,0,.25); box-shadow: inset 0 1px 0 rgba(0,0,0,.22);
  }
  .socket:empty::before { content: ""; width: 22px; height: 16px; margin: 0 4px; border-radius: 999px; background: rgba(255,255,255,.28); }
  .socket.drop-on { background: #ffd500; outline: 2px solid #ffbf00; }
  .socket.t-str, .socket.t-bool { border-radius: 6px; }
  .fly .reporter { margin: 4px 0; align-self: flex-start; }
  .mini { height: 22px; border: 0; border-radius: 11px; background: rgba(255,255,255,.22); color: #fff; font-size: 11px; font-weight: 800; padding: 0 8px; }
  .var-menu { position: fixed; z-index: 90; min-width: 176px; max-height: 280px; overflow: auto; padding: 6px; background: #fff; border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.22); }
  .var-menu button { display: block; width: 100%; height: auto; margin: 0; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font-weight: 700; text-align: left; }
  .var-menu button.on, .var-menu button:hover { background: #ff8c1a; color: #fff; }
  @media (max-width: 900px) {
    .tabs { display: flex; }
    .app { grid-template-columns: 1fr; height: calc(100% - 92px); }
    nav.cats, aside.fly, main, aside.code { display: none; }
    body[data-panel="palette"] nav.cats, body[data-panel="palette"] aside.fly,
    body[data-panel="stacks"] main, body[data-panel="code"] aside.code { display: flex; }
    body[data-panel="palette"] nav.cats { flex-direction: row; flex-wrap: wrap; }
    .sb-cat { width: 72px; }
    main { display: block; }
  }
</style>
</head>
<body data-panel="stacks">
<header>
  <div class="mark">B</div>
  <div class="grow">
    <h1>Pack Blocks</h1>
    <p id="notice">Drop a value into a slot of the same type. Math blocks go in number slots.</p>
  </div>
  <div class="trash" id="trash">Drop to delete</div>
  <button class="flag gray" id="undo" type="button">Undo</button>
  <button class="flag" id="copy" type="button">Copy code</button>
  <button class="flag blue" id="save" type="button">Download JS</button>
</header>
<div class="tabs">
  <button data-panel="palette">Blocks</button>
  <button data-panel="stacks" class="on">Scripts</button>
  <button data-panel="code">Code</button>
</div>
<div class="app">
  <nav class="cats" id="cats"></nav>
  <aside class="fly" id="fly"></aside>
  <main id="board"><div class="scripts" id="scripts"></div></main>
  <aside class="code"><p>Generated JavaScript</p><pre id="code"></pre></aside>
</div>
<script>
const HOOKS = [
  ["onUse", "used"], ["onHit", "hit"], ["onBlockUse", "block used"],
  ["onBlockBreak", "block broken"], ["onBlockPlace", "block placed"],
  ["onTick", "held"], ["onProjectileHit", "projectile hits"]
];
const FEATURE_EVENTS = [
  ["onChat", "chat message"], ["onTick", "game tick"],
  ["onPlayerJoin", "player joins"], ["onPlayerLeave", "player leaves"]
];
const SOUNDS = ["pickup", "click", "break", "place", "hit", "hurt", "splash", "swim", "footstep", "lavaPop", "sizzle", "drown", "gasp"];
const PARTICLES = ["smoke", "bubble", "water", "lava", "break"];
const OPS = ["===", "!==", "<", "<=", ">", ">="];
const CATS = [
  ["events", "Events", "#ffbf00"], ["sound", "Sound", "#cf63cf"], ["motion", "Motion", "#4c97ff"],
  ["looks", "World", "#9966ff"], ["sensing", "Sensing", "#5cb1d6"],
  ["math", "Math", "#59c059"],
  ["control", "Control", "#ffab19"], ["myblocks", "My Blocks", "#ff6680"]
];
const MATH = [
  ["+", "+", 2, "infix"], ["-", "−", 2, "infix"], ["*", "×", 2, "infix"], ["/", "÷", 2, "infix"],
  ["%", "mod", 2, "infix"], ["**", "^", 2, "infix"],
  ["min", "min", 2, "prefix"], ["max", "max", 2, "prefix"],
  ["abs", "abs", 1, "prefix"], ["round", "round", 1, "prefix"], ["floor", "floor", 1, "prefix"],
  ["ceil", "ceil", 1, "prefix"], ["sqrt", "√", 1, "prefix"],
  ["sin", "sin", 1, "prefix"], ["cos", "cos", 1, "prefix"], ["tan", "tan", 1, "prefix"],
  ["random", "random", 2, "random"]
];
function part(id, label, slots, extra) {
  return Object.assign({ id, label, slots, path: extra && extra.path != null ? extra.path : id }, extra || {});
}
const PLAYER_PARTS = [
  part("", "player", ["who"], { path: "" }),
  part("name", "name", ["value"], { str: true }),
  part("id", "id", ["value"]),
  part("health", "health", ["value"]),
  part("dead", "dead", ["value"], { bool: true }),
  part("position", "position", ["pos"], { posPath: "position" }),
  part("position.x", "x", ["value"]),
  part("position.y", "y", ["value"]),
  part("position.z", "z", ["value"]),
  part("look", "looking", ["pos"], { posPath: "look" }),
  part("look.x", "look x", ["value"]),
  part("look.y", "look y", ["value"]),
  part("look.z", "look z", ["value"]),
  part("yawDegrees", "yaw", ["value"]),
  part("pitchDegrees", "pitch", ["value"]),
  part("yaw", "yaw rad", ["value"]),
  part("pitch", "pitch rad", ["value"]),
  part("gameMode", "mode", ["value"], { str: true })
];
const POS_PARTS = [
  part("position", "position", ["pos"], { posPath: "position" }),
  part("position.x", "x", ["value"]),
  part("position.y", "y", ["value"]),
  part("position.z", "z", ["value"])
];
const FACE_PARTS = [
  part("face.x", "face x", ["value"]),
  part("face.y", "face y", ["value"]),
  part("face.z", "face z", ["value"])
];
const KINDS = {
  player: { label: "player", expr: "player", fields: PLAYER_PARTS },
  attackedPlayer: { label: "attacked player", expr: "event.attackedPlayer", fields: PLAYER_PARTS.filter((p) => p.id !== "yaw" && p.id !== "pitch" && p.id !== "gameMode") },
  clickedBy: { label: "clicked by", expr: "event.clickedBy", fields: PLAYER_PARTS },
  senderPlayer: { label: "sender", expr: "event.senderPlayer", fields: PLAYER_PARTS.filter((p) => p.id !== "gameMode") },
  joinedPlayer: { label: "joined player", expr: "event.joinedPlayer", fields: [
    part("", "player", ["who"], { path: "" }),
    part("name", "name", ["value"], { str: true }),
    part("id", "id", ["value"])
  ] },
  leavingPlayer: { label: "leaving player", expr: "event.leavingPlayer", fields: [
    part("", "player", ["who"], { path: "" }),
    part("name", "name", ["value"], { str: true }),
    part("id", "id", ["value"])
  ] },
  block: { label: "block", expr: "block", fields: [
    part("", "block", ["pos"], { path: "", posPath: "position" }),
    part("id", "id", ["value"]),
    part("type", "type", ["value"], { str: true }),
    ...POS_PARTS,
    ...FACE_PARTS
  ] },
  hit: { label: "hit", expr: "event.hit", fields: [
    part("", "hit", ["pos"], { path: "", posPath: "position" }),
    part("type", "type", ["value"], { str: true }),
    part("id", "id", ["value"]),
    ...POS_PARTS,
    ...FACE_PARTS
  ] },
  event: { label: "event", expr: "event", fields: [
    part("type", "type", ["value"], { str: true }),
    part("message", "message", ["value"], { str: true, when: ["onChat"] }),
    part("sender", "sender", ["value"], { str: true, when: ["onChat"] }),
    part("dt", "tick", ["value"], { when: ["onTick"] }),
    part("position", "position", ["pos"], { posPath: "position", when: ["onUse", "onHit", "onBlockUse", "onBlockBreak", "onBlockPlace", "onProjectileHit"] }),
    part("position.x", "x", ["value"], { when: ["onUse", "onHit", "onBlockUse", "onBlockBreak", "onBlockPlace", "onProjectileHit"] }),
    part("position.y", "y", ["value"], { when: ["onUse", "onHit", "onBlockUse", "onBlockBreak", "onBlockPlace", "onProjectileHit"] }),
    part("position.z", "z", ["value"], { when: ["onUse", "onHit", "onBlockUse", "onBlockBreak", "onBlockPlace", "onProjectileHit"] })
  ] },
  world: { label: "world", expr: "world", fields: [part("time", "time", ["value"])] },
  item: { label: "item", expr: "event.item", fields: [
    part("id", "id", ["value"]),
    part("name", "name", ["value"], { str: true }),
    part("kind", "kind", ["value"], { str: true })
  ] },
  rayPlayer: { label: "looked-at player", expr: "", fields: [
    part("", "player", ["who"], { path: "player" }),
    part("health", "health", ["value"], { path: "player.health" }),
    part("name", "name", ["value"], { path: "player.name", str: true }),
    part("id", "id", ["value"], { path: "player.id" }),
    part("dead", "dead", ["value"], { path: "player.dead", bool: true }),
    part("position", "position", ["pos"], { path: "player.position", posPath: "player.position" }),
    part("position.x", "x", ["value"], { path: "player.position.x" }),
    part("position.y", "y", ["value"], { path: "player.position.y" }),
    part("position.z", "z", ["value"], { path: "player.position.z" }),
    part("look", "looking", ["pos"], { path: "player.look", posPath: "player.look" }),
    part("look.x", "look x", ["value"], { path: "player.look.x" }),
    part("look.y", "look y", ["value"], { path: "player.look.y" }),
    part("look.z", "look z", ["value"], { path: "player.look.z" }),
    part("yawDegrees", "yaw", ["value"], { path: "player.yawDegrees" }),
    part("pitchDegrees", "pitch", ["value"], { path: "player.pitchDegrees" }),
    part("hit", "hit position", ["pos"], { path: "position", posPath: "position" }),
    part("distance", "distance", ["value"], { path: "distance" })
  ] },
  rayBlock: { label: "looked-at block", expr: "", fields: [
    part("", "block", ["pos"], { path: "", posPath: "position" }),
    part("id", "id", ["value"], { path: "id" }),
    part("distance", "distance", ["value"], { path: "distance" }),
    part("position", "position", ["pos"], { path: "position", posPath: "position" }),
    part("position.x", "x", ["value"], { path: "position.x" }),
    part("position.y", "y", ["value"], { path: "position.y" }),
    part("position.z", "z", ["value"], { path: "position.z" }),
    part("blockPosition.x", "block x", ["value"], { path: "blockPosition.x" }),
    part("blockPosition.y", "block y", ["value"], { path: "blockPosition.y" }),
    part("blockPosition.z", "block z", ["value"], { path: "blockPosition.z" }),
    ...FACE_PARTS
  ] }
};
const SNAP_LIMIT = 64;
const AIM_MODES = [["look", "looking"], ["angles", "yaw / pitch"], ["vector", "x y z"]];
const ACTIONS = [
  ["playSound", "play sound", "sound", "#cf63cf"],
  ["particle", "particle", "looks", "#9966ff"],
  ["heal", "heal", "motion", "#4c97ff"],
  ["damage", "damage", "motion", "#4c97ff"],
  ["velocity", "push", "motion", "#4c97ff"],
  ["teleport", "go to", "motion", "#4c97ff"],
  ["giveItem", "give item", "looks", "#9966ff"],
  ["setBlock", "set block", "looks", "#9966ff"],
  ["spawnDrop", "drop item", "looks", "#9966ff"],
  ["setTime", "set time", "looks", "#9966ff"],
  ["say", "say", "looks", "#9966ff"],
  ["shake", "shake", "looks", "#9966ff"],
  ["launch", "launch projectile", "looks", "#9966ff"],
  ["rayIf", "if looking at", "sensing", "#5cb1d6"],
  ["if", "if <> then", "control", "#ffab19"],
  ["repeat", "repeat", "control", "#ffab19"],
  ["returnHit", "hit power", "control", "#ffab19"],
  ["callService", "call", "myblocks", "#ff6680"]
];
const STORE = "ezzycraft-pack-blocks";
let seq = 10;
const uid = (p) => p + (++seq);
let cat = "events";
let drag = null;
let didDrag = false;
let history = [];
let spawnN = 0;
let varMenu = null;
let model = {
  services: [{ id: "svc1", name: "playPickup", x: 36, y: 36, body: [{ id: "s1", kind: "playSound", sound: "pickup" }] }],
  items: [{ id: "item1", key: "magicSword", hooks: [{ id: "hook1", name: "onUse", x: 340, y: 36, body: [
    { id: "s2", kind: "callService", name: "playPickup" },
    { id: "s3", kind: "velocity", x: "0", y: "0.8", z: "0", who: { producer: "hat", kind: "player", field: "" } }
  ] }] }],
  features: [{ id: "feat1", name: "chatListener", event: "onChat", x: 36, y: 280, body: [
    { id: "s4", kind: "if", cmp: { producer: "hat", kind: "event", field: "message" }, op: "===", right: "hello", then: [
      { id: "s5", kind: "playSound", sound: "pickup" }
    ] }
  ] }],
  loose: []

function isC(stmt) { return stmt && (stmt.kind === "if" || stmt.kind === "rayIf" || stmt.kind === "repeat"); }
function actionColor(kind) { return (ACTIONS.find((a) => a[0] === kind) || [,,, "#4c97ff"])[3]; }
function actionLabel(kind) { return (ACTIONS.find((a) => a[0] === kind) || [, kind])[1]; }
function hookLabel(name) { return (HOOKS.find((h) => h[0] === name) || [, name])[1]; }
function clone(value) { return JSON.parse(JSON.stringify(value)); }
function fieldDef(kind, fieldId) {
  const kindDef = KINDS[kind];
  if (!kindDef) return null;
  return kindDef.fields.find((field) => field.id === (fieldId || "")) || null;
}
function fieldsFor(kind, script) {
  const kindDef = KINDS[kind];
  if (!kindDef) return [];
  const event = script ? scriptEvent(script) : null;
  return kindDef.fields.filter((field) => !field.when || (event && field.when.indexOf(event) >= 0));
}
function refLabel(ref) {
  if (!ref) return "variable";

    const spec = MATH.find((row) => row[0] === ref.op);

function setFields(id, patch) {
  updateStmt(id, (cur) => Object.assign(cur, patch));
  codeOnly();
}
function closeVarMenu() {
  if (varMenu) { varMenu.remove(); varMenu = null; }
}
function openVarMenu(anchor, fields, current, onPick) {
  closeVarMenu();
  const box = el("div", { class: "var-menu" });
  fields.forEach((field) => {
    box.append(el("button", { type: "button", class: field.id === (current || "") ? "on" : "", onclick: (e) => {
      e.stopPropagation();
      onPick(field.id);
      closeVarMenu();
    } }, [field.label]));
  });
  document.body.append(box);
  const rect = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(rect.left, window.innerWidth - 200));
  box.style.left = left + "px";
  box.style.top = (rect.bottom + 6) + "px";
  if (rect.bottom + 6 + box.offsetHeight > window.innerHeight) box.style.top = Math.max(8, rect.top - box.offsetHeight - 6) + "px";
  varMenu = box;
}
function shownField(kind, picked, script) {
  const fields = fieldsFor(kind, script);
  if (picked && fields.some((field) => field.id === picked)) return picked;
  if (fields.some((field) => field.id === "")) return "";
  return (fields[0] || { id: "" }).id;
}
function displayLabel(ref, script) {
  if (ref && ref.kind === "player" && script && scriptEvent(script) === "onUse") {
    const field = fieldDef(ref.kind, ref.field);
    return !field || !field.id ? "user" : "user · " + field.label;
  }
  return refLabel(ref);
}
function sourceChip(kind, field, onField, producer, script) {
  const ref = { kind, field: field || "" };
  const used = kind === "player" && script && scriptEvent(script) === "onUse";
  const chip = el("span", {
    class: "reporter",
    title: used ? "The player who used this item. Double-click for yaw, pitch, and look direction." : "Drag into a round slot. Double-click for position, health, and other parts."
  }, [displayLabel(ref, script)]);
  chip.addEventListener("dblclick", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const kindDef = KINDS[kind];
    if (!kindDef) return;
    openVarMenu(chip, fieldsFor(kind, script), field || "", onField);
  });
  return bindDrag(chip, { type: "var", value: { producer, kind, field: field || "" } }, true);
}
function hatChips(script, rec) {
  const picks = rec.picks || {};
  return hatVars(script).map((kind) => {
    const field = shownField(kind, picks[kind] || "", script);
    return sourceChip(kind, field, (next) => {
      const live = scriptRecord(script);
      if (!live) return;
      live.picks = Object.assign({}, live.picks, { [kind]: next });
      render();
    }, "hat", script);
  });
}
function numSocket(stmt, path, script) { return exprSocket(stmt, path, script, ["num"]); }
function reporterChip(value, slot, script, stmtId) {
  const bad = !refFits(value, slot, script, stmtId);
  const chip = el("span", {
    class: "reporter" + (bad ? " bad" : ""),
    title: bad ? grayReason(value, slot, script, stmtId) : "Double-click for parts this slot can use"
  }, [displayLabel(value, script)]);
  const found = locate(stmtId);
  const stmt = found && found.stmt;
  if (value.kind === "xyz" && stmt) {
    chip.append(exprSocket(stmt, slot + ".x", script, ["num"]), exprSocket(stmt, slot + ".y", script, ["num"]), exprSocket(stmt, slot + ".z", script, ["num"]));
  } else if (KINDS[value.kind]) {
    chip.addEventListener("dblclick", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const allowed = accepts(slot, stmt);
      const fields = fieldsFor(value.kind, script).filter((field) => {
        const next = Object.assign({}, value, { field: field.id });
        return allowed.indexOf(refType(next)) >= 0;
      });
      openVarMenu(chip, fields, value.field || "", (next) => {
        const live = locate(stmtId);
        const current = live && slotGet(live.stmt, slot);
        if (!current || typeof current !== "object") return;
        snapshot();
        updateStmt(stmtId, (cur) => writePath(cur, slot, Object.assign({}, current, { field: next })));
        render();
      });
    });
  }
  return bindDrag(chip, { type: "var", value: copyExpr(value), fromId: stmtId, fromSlot: slot }, true);
}
function mathChip(expr, path, script, stmtId) {
  const spec = MATH.find((row) => row[0] === expr.op) || ["+", "+", 2, "infix"];
  const bad = !refFits(expr, path, script, stmtId);
  const chip = el("span", {
    class: "reporter math" + (bad ? " bad" : ""),
    title: bad ? grayReason(expr, path, script, stmtId) : "Number"
  });
  const found = locate(stmtId);
  const stmt = found && found.stmt;
  const a = stmt ? exprSocket(stmt, path + ".a", script, ["num"]) : el("span");
  const b = spec[2] > 1 && stmt ? exprSocket(stmt, path + ".b", script, ["num"]) : null;
  if (spec[3] === "prefix") {
    chip.append(spec[1], a);
    if (b) chip.append(b);
    if (expr.op === "sin" || expr.op === "cos" || expr.op === "tan") chip.append("°");
  } else if (spec[3] === "random") chip.append("random", a, "to", b);
  else chip.append(a, spec[1], b);
  return bindDrag(chip, { type: "var", value: copyExpr(expr), fromId: stmtId, fromSlot: path }, true);
}
function blockChip(expr, path, script, stmtId) {
  const found = locate(stmtId);
  const stmt = found && found.stmt;
  const chip = el("span", { class: "reporter", title: "Block id at a position. Drop into a number slot." }, ["block id at"]);
  if (stmt) chip.append(exprSocket(stmt, path + ".pos", script, ["pos"]));
  return bindDrag(chip, { type: "var", value: copyExpr(expr), fromId: stmtId, fromSlot: path }, true);
}
function exprChip(value, path, script, stmtId) {
  if (value && value.expr === "math") return mathChip(value, path, script, stmtId);
  if (value && value.expr === "block") return blockChip(value, path, script, stmtId);
  return reporterChip(value, path, script, stmtId);
}
function exprSocket(stmt, path, script, types) {
  const list = types && types.length ? types : ["num"];
  const node = bindDrop(el("span", { class: "socket t-" + list[0] }), { place: "socket", slot: path, id: stmt.id, script, type: list.join(",") });
  const value = slotGet(stmt, path);
  if (value && typeof value === "object") node.append(exprChip(value, path, script, stmt.id));
  else if (list.length === 1 && list[0] === "num") node.append(bubble(value == null || value === "" ? "0" : value, (raw) => setPath(stmt.id, path, raw)));
  else if (list.length === 1 && list[0] === "str") node.append(bubble(value == null ? "" : value, (raw) => setPath(stmt.id, path, raw), "cmp"));
  else if (list.length === 1 && list[0] === "bool") node.append(menu(value === true || value === "true" ? "true" : "false", [["true", "true"], ["false", "false"]], (raw) => { setPath(stmt.id, path, raw); render(); }));
  else if (list.length === 1 && list[0] === "pos") {
    node.append(el("button", { class: "mini", type: "button", title: "Type x y z", onclick: (e) => {
      e.stopPropagation();
      snapshot();
      setPath(stmt.id, path, { kind: "xyz", x: "0", y: "0", z: "0" });
      render();
    } }, ["123"]));
  }
  return node;
}
function socketNode(stmt, slot, script) {
  return exprSocket(stmt, slot, script, accepts(slot, stmt));
}
function paintFields(stmt, row, script) {
  if (stmt.kind === "playSound") row.append("play sound", menu(stmt.sound, SOUNDS, (sound) => setFields(stmt.id, { sound })));
  if (stmt.kind === "particle") row.append("particle", menu(stmt.particle, PARTICLES, (particle) => setFields(stmt.id, { particle })), "at", socketNode(stmt, "pos", script));
  if (stmt.kind === "heal") row.append("heal", socketNode(stmt, "who", script), "by", numSocket(stmt, "amount", script));
  if (stmt.kind === "damage") row.append("damage", socketNode(stmt, "who", script), "by", numSocket(stmt, "amount", script));
  if (stmt.kind === "velocity") row.append("push", socketNode(stmt, "who", script), "x", numSocket(stmt, "x", script), "y", numSocket(stmt, "y", script), "z", numSocket(stmt, "z", script));
  if (stmt.kind === "teleport") row.append("move", socketNode(stmt, "who", script), "to", socketNode(stmt, "pos", script));
  if (stmt.kind === "say") row.append("say", exprSocket(stmt, "text", script, ["str"]));
  if (stmt.kind === "shake") row.append("shake camera", numSocket(stmt, "amount", script));
  if (stmt.kind === "giveItem") row.append("give", socketNode(stmt, "who", script), "id", numSocket(stmt, "itemId", script), "×", numSocket(stmt, "count", script));
  if (stmt.kind === "setBlock") row.append("set block", numSocket(stmt, "blockId", script), "at", socketNode(stmt, "pos", script));
  if (stmt.kind === "spawnDrop") row.append("drop id", numSocket(stmt, "itemId", script), "×", numSocket(stmt, "count", script), "at", socketNode(stmt, "pos", script));
  if (stmt.kind === "setTime") row.append("set time to", numSocket(stmt, "hours", script), "hours");
  if (stmt.kind === "launch") {
    const aim = stmt.aim || "look";
    row.append("launch speed", numSocket(stmt, "speed", script), "life", numSocket(stmt, "lifetime", script), "dmg", numSocket(stmt, "damage", script),
      "aim", menu(aim, AIM_MODES, (next) => { setFields(stmt.id, { aim: next }); render(); }));
    if (aim === "angles") row.append("yaw", numSocket(stmt, "yaw", script), "°", "pitch", numSocket(stmt, "pitch", script), "°");
    if (aim === "vector") row.append("x", numSocket(stmt, "dx", script), "y", numSocket(stmt, "dy", script), "z", numSocket(stmt, "dz", script));
  }
  if (stmt.kind === "callService") {
    const names = model.services.map((s) => s.name);
    if (stmt.name && !names.includes(stmt.name)) names.unshift(stmt.name);
    row.append("call", names.length ? menu(stmt.name, names, (name) => setFields(stmt.id, { name })) : bubble(stmt.name, (name) => setFields(stmt.id, { name }), true));
  }
  if (stmt.kind === "returnHit") row.append("hit damage ×", numSocket(stmt, "damage", script), "knockback ×", numSocket(stmt, "knockback", script));
}
function stmtNode(stmt, script, depth) {
  const color = actionColor(stmt.kind);
  const after = { script, place: "after", id: stmt.id };
  const z = String(40 - depth);
  if (isC(stmt)) {
    const row = bindDrag(el("div", { class: "sb sb-c sb-stack", style: "--sb:" + color + ";z-index:" + z }), { type: "stmt", id: stmt.id }, true);
    bindDrop(row, after);
    const head = el("div", { class: "sb-head" });
    if (stmt.kind === "if") {
      head.append("if", exprSocket(stmt, "cmp", script, accepts("cmp", stmt)),
        menu(stmt.op || "===", OPS, (op) => setFields(stmt.id, { op })),
        exprSocket(stmt, "right", script, accepts("right", stmt)), "then");
    } else if (stmt.kind === "rayIf") {
      const rayKind = stmt.target === "block" ? "rayBlock" : "rayPlayer";
      const rayField = shownField(rayKind, stmt.rayField || "", script);
      head.append("if looking at", menu(stmt.target, [["player", "player"], ["block", "block"]], (targetType) => { setFields(stmt.id, { target: targetType, rayField: "" }); render(); }),
        "within", numSocket(stmt, "maxDistance", script), "blocks", "connected",
        sourceChip(rayKind, rayField, (next) => { setFields(stmt.id, { rayField: next }); render(); }, stmt.id, script));
    } else head.append("repeat", numSocket(stmt, "times", script), "times");
    head.append(xbtn(() => { takeStmt(stmt.id); }));
    row.append(head);
    const mouth = bindDrop(el("div", { class: "sb-mouth" }), { script, place: "into", id: stmt.id });
    if (!stmt.then.length) mouth.append(el("p", { class: "empty" }, ["drop blocks here"]));
    else stmt.then.forEach((child, i) => mouth.append(stmtNode(child, script, i)));
    row.append(mouth, el("div", { class: "sb-foot" }));
    return row;
  }
  const row = bindDrag(el("div", { class: "sb sb-stack", style: "--sb:" + color + ";z-index:" + z }), { type: "stmt", id: stmt.id }, true);
  bindDrop(row, after);
  paintFields(stmt, row, script);
  row.append(xbtn(() => { takeStmt(stmt.id); }));
  return row;
}
function hat(color, kids, script) {
  const row = bindDrop(el("div", { class: "sb sb-hat", style: "--sb:" + color + ";z-index:50" }), { script, place: "start" });
  const title = el("div", { class: "hat-title" });
  const values = el("div", { class: "hat-values" });
  kids.forEach((kid) => {
    if (kid && kid.classList && kid.classList.contains("reporter")) values.append(kid);
    else title.append(kid);
  });
  row.append(title);
  if (values.childNodes.length) row.append(values);
  return row;
}
function scriptBox(hatNode, body, script, rec) {
  const box = bindDrag(el("div", { class: "script" + (script.kind === "loose" ? " off-stack" : ""), style: "left:" + (rec.x || 36) + "px;top:" + (rec.y || 36) + "px" }), { type: "script", script });
  bindDrop(box, { script, place: "end" });
  if (hatNode) box.append(hatNode);
  else box.append(slot({ script, place: "start" }));
  body.forEach((stmt, i) => box.append(stmtNode(stmt, script, i)));
  return box;
}

function paletteHat(color, text, payload, onClick) {
  return bindDrag(el("div", { class: "sb sb-hat", style: "--sb:" + color, role: "button", onclick: () => { if (!didDrag) onClick(); } }, [text]), payload);
}
function paletteStack(action) {
  return bindDrag(el("div", { class: "sb sb-stack", style: "--sb:" + action[3], role: "button", onclick: () => {
    if (!didDrag) placeNew(action[0], spawnPos());
  } }, [action[1]]), { type: "palette", kind: action[0] });
}
function paletteBlockAt() {
  return bindDrag(el("span", {
    class: "reporter", role: "button", title: "Drop into a number slot",
    onclick: () => { if (!didDrag) note("Drop this into a number slot."); }
  }, ["block id at"]), { type: "var", value: { expr: "block", pos: null } });
}
function paletteMath(row) {
  return bindDrag(el("span", {
    class: "reporter math", role: "button", title: "Drop into a number slot",
    onclick: () => { if (!didDrag) note("Drop this into a number slot."); }
  }, [row[1]]), { type: "var", value: freshMath(row[0]) });
}
function render() {
  closeVarMenu();
  migrate();
  if (!CATS.some(([id]) => id === cat)) cat = "events";
  document.body.dataset.panel = document.body.dataset.panel || "stacks";
  const cats = document.getElementById("cats");
  cats.replaceChildren(...CATS.map(([id, labelText, color]) => el("button", {
    class: "sb-cat" + (cat === id ? " on" : ""), style: "background:" + color,
    onclick: () => { cat = id; document.body.dataset.panel = "palette"; document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.panel === "palette")); render(); }
  }, [labelText])));
  const fly = document.getElementById("fly");
  const bits = [el("p", { class: "hint" }, [cat === "math" ? "Drag a math block into a number slot." : "Drag onto a stack. Values only fit slots of the same type."])];
  if (cat === "events") {
    bits.push(paletteHat("#ffbf00", "when item clicked", { type: "hat", hat: "item" }, () => dropHat({ hat: "item" }, spawnPos())));
    HOOKS.forEach(([id, labelText]) => bits.push(paletteHat("#ffbf00", "when " + labelText.toLowerCase(), { type: "hat", hat: "hook", hook: id }, () => dropHat({ hat: "hook", hook: id }, spawnPos()))));
    bits.push(paletteHat("#ff6680", "define my block", { type: "hat", hat: "service" }, () => dropHat({ hat: "service" }, spawnPos())));
    FEATURE_EVENTS.forEach(([id, labelText]) => bits.push(paletteHat("#0fbd8c", "when " + labelText, { type: "hat", hat: "feature", event: id }, () => dropHat({ hat: "feature", event: id }, spawnPos()))));
  }
  if (cat === "sensing") bits.push(paletteBlockAt());
  if (cat === "math") MATH.forEach((row) => bits.push(paletteMath(row)));
  ACTIONS.filter((a) => a[2] === cat).forEach((a) => bits.push(paletteStack(a)));
  fly.replaceChildren(...bits);
  const scripts = [];
  model.services.forEach((service) => {
    const script = { kind: "service", id: service.id };
    scripts.push(scriptBox(hat("#ff6680", ["define ", bubble(service.name, (name) => {
      const live = model.services.find((s) => s.id === service.id);
      if (!live) return;
      const previous = live.name;
      live.name = name;
      if (previous && previous !== name) {
        eachScript((body) => {
          const walk = (list) => (list || []).forEach((stmt) => {
            if (stmt.kind === "callService" && stmt.name === previous) stmt.name = name;
            if (stmt.then) walk(stmt.then);
          });
          walk(body);
        });
      }
      codeOnly();
    }, true), xbtn(() => { model.services = model.services.filter((s) => s.id !== service.id); }), ...hatChips(script, service)], script), service.body, script, service));
  });
  model.items.forEach((item) => item.hooks.forEach((hook) => {
    const script = { kind: "hook", itemId: item.id, hookId: hook.id };
    scripts.push(scriptBox(hat("#ffbf00", ["when ", bubble(item.key, (key) => {
      const live = model.items.find((entry) => entry.id === item.id);
      if (live) live.key = key;
      codeOnly();
    }, true), " " + hookLabel(hook.name).toLowerCase(), xbtn(() => {
      item.hooks = item.hooks.filter((h) => h.id !== hook.id);
      model.items = model.items.filter((entry) => entry.hooks.length);
    }), ...hatChips(script, hook)], script), hook.body, script, hook));
  }));
  model.features.forEach((feature) => {
    const script = { kind: "feature", id: feature.id };
    scripts.push(scriptBox(hat("#0fbd8c", ["when ", bubble(feature.name, (name) => {
      const live = model.features.find((f) => f.id === feature.id);
      if (live) live.name = name;
      codeOnly();
    }, true), menu(feature.event || "onChat", FEATURE_EVENTS, (eventName) => {
      const live = model.features.find((f) => f.id === feature.id);
      if (live) live.event = eventName;
      render();
    }), xbtn(() => { model.features = model.features.filter((f) => f.id !== feature.id); }), ...hatChips(script, feature)], script), feature.body, script, feature));
  });
  (model.loose || []).forEach((loose) => {
    const script = { kind: "loose", id: loose.id };
    scripts.push(scriptBox(null, loose.body, script, loose));
  });
  const area = document.getElementById("scripts");
  area.replaceChildren(...scripts);
  let w = area.parentElement.clientWidth || 800, h = area.parentElement.clientHeight || 600;
  allPlaced().forEach((rec) => {
    w = Math.max(w, (rec.x || 0) + 420);
    h = Math.max(h, (rec.y || 0) + 420);
  });
  area.style.width = w + "px";
  area.style.height = h + "px";
  codeOnly();
  persist();
}
function codeOnly() { document.getElementById("code").textContent = generate(); persist(); }

bindDrop(document.getElementById("board"), { place: "workspace" });
bindDrop(document.getElementById("trash"), { place: "trash" });
document.querySelectorAll(".tabs button").forEach((button) => button.addEventListener("click", () => {
  document.body.dataset.panel = button.dataset.panel;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b === button));
}));
document.getElementById("undo").addEventListener("click", () => {
  const prev = history.pop();
  if (!prev) { note("Nothing to undo."); return; }
  model = JSON.parse(prev);
  migrate();
  render();
  note("Undid last change.");
});
document.addEventListener("pointerdown", (e) => {
  if (varMenu && !varMenu.contains(e.target)) closeVarMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeVarMenu();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    document.getElementById("undo").click();
  }
});
document.getElementById("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(generate()); note("Copied. Paste it into the pack-wide JavaScript module."); }
  catch { note("Copy was blocked. Use Download JS instead."); }
});
document.getElementById("save").addEventListener("click", () => {
  const blob = new Blob([generate() + "\n"], { type: "text/javascript" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "pack-module.js"; a.click();
  URL.revokeObjectURL(url);
  note("Downloaded pack-module.js. Paste that text into Sprite Studio.");
});
restore();
render();
