<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pack Block Editor</title>
<style>
  :root {
    --board: #e6f0ff;
    --ink: #575e75;
    --muted: #7a8499;
    --line: #d0d8e6;
    --white: #fff;
    --notch-x: 18px;
    --notch-w: 26px;
    --notch-h: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--board); color: var(--ink); font-family: Helvetica, Arial, sans-serif; }
  button, select, input { font: inherit; }
  button, [role="button"] { cursor: pointer; }
  header { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; background: var(--white); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 14px; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }
  .mark { width: 32px; height: 32px; border-radius: 6px; background: #ffbf00; color: #fff; font-weight: 900; display: grid; place-items: center; flex-shrink: 0; }
  .grow { flex: 1; min-width: 0; }
  .grow p, .grow h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flag { height: 32px; border: 0; border-radius: 999px; background: #4cbf56; color: #fff; font-weight: 700; padding: 0 12px; }
  .flag.blue { background: #4c97ff; }
  .flag.gray { background: #7a8499; }
  .trash { min-width: 88px; height: 32px; border: 2px dashed var(--line); border-radius: 8px; background: #f6f8fc; color: var(--muted); font-weight: 700; font-size: 12px; display: grid; place-items: center; }
  .trash.drop-on { border-color: #ff6680; background: #ffe6eb; color: #ff6680; }
  .tabs { display: none; background: var(--white); border-bottom: 1px solid var(--line); }
  .tabs button { height: 44px; flex: 1; border: 0; background: transparent; font-weight: 700; color: var(--muted); }
  .tabs button.on { color: #4c97ff; }
  .app { display: grid; height: calc(100% - 48px); grid-template-columns: 72px 250px minmax(0, 1fr) 300px; min-height: 0; }
  nav.cats { background: var(--white); padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
  .sb-cat { display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: center; color: #fff; border: 0; border-radius: 6px; font-size: 10px; font-weight: 700; }
  .sb-cat.on { outline: 3px solid rgba(255,255,255,.9); outline-offset: -5px; }
  aside.fly, aside.code { background: var(--white); min-height: 0; overflow: auto; }
  aside.fly { --behind: var(--white); border-right: 1px solid #d6e2f2; padding: 12px 12px 20px; display: flex; flex-direction: column; gap: 12px; }
  aside.code { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  aside.code p { margin: 0; padding: 8px 12px; border-bottom: 1px solid #e6ebf2; font-size: 12px; font-weight: 700; color: var(--muted); }
  pre { margin: 0; padding: 12px; overflow: auto; font: 11px/1.45 ui-monospace, monospace; color: #394056; white-space: pre-wrap; }
  main { --behind: var(--board); position: relative; min-height: 0; overflow: auto; background-color: var(--board); background-image: radial-gradient(#c5d6ee 1.2px, transparent 1.2px); background-size: 20px 20px; }
  main.drop-on { outline: 3px dashed #4c97ff; outline-offset: -8px; }
  .scripts { position: relative; min-width: 100%; min-height: 100%; }
  .hint { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0; }
  .sb {
    --sb: #4c97ff;
    position: relative;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 6px;
    width: max-content;
    min-width: 168px;
    min-height: 40px;
    margin: 0;
    padding: 8px 14px 10px 10px;
    color: #fff;
    background: var(--sb);
    border: 0;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    text-align: left;
    white-space: nowrap;
    box-shadow: 0 2px 0 rgba(0,0,0,.18);
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .sb:active { cursor: grabbing; }
  .sb::after {
    content: "";
    position: absolute;
    left: var(--notch-x);
    bottom: calc(-1 * var(--notch-h) + 1px);
    width: var(--notch-w);
    height: var(--notch-h);
    background: var(--sb);
    border-radius: 0 0 6px 6px;
    z-index: 3;
  }
  .sb-stack { margin-top: calc(-1 * var(--notch-h) + 1px); padding-top: 10px; }
  .sb-stack::before {
    content: "";
    position: absolute;
    left: var(--notch-x);
    top: 0;
    width: var(--notch-w);
    height: var(--notch-h);
    background: var(--behind, var(--board));
    border-radius: 0 0 6px 6px;
    z-index: 4;
  }
  .sb-hat { margin-top: 0; padding-top: 14px; border-radius: 18px 18px 4px 4px; }
  .sb-c { display: flex; flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 0; padding: 8px 8px 0; white-space: normal; width: auto; }
  .sb-head { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; min-height: 28px; padding: 0 6px 6px 2px; white-space: nowrap; }
  .sb-mouth {
    --behind: color-mix(in srgb, var(--sb) 68%, #000);
    min-height: 36px;
    margin: 0 2px 0 16px;
    padding: 16px 4px 12px;
    background: var(--behind);
    border-radius: 0 8px 8px 0;
  }
  .sb-foot { height: 14px; margin: 4px -8px 0; background: var(--sb); border-radius: 0 0 4px 4px; }
  .sb input, .sb select { height: 22px; max-width: 148px; padding: 0 8px; color: var(--ink); background: #fff; border: 0; border-radius: 11px; font-size: 12px; font-weight: 700; cursor: text; touch-action: auto; }
  .sb input.num { width: 52px; max-width: 52px; padding: 0 6px; text-align: center; }
  .sb input.cmp { width: 92px; max-width: 110px; }
  .wide { max-width: 180px !important; }
  .sb-x { margin-left: auto; width: 18px; height: 18px; color: #fff; background: rgba(0,0,0,.18); border: 0; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
  .script { position: absolute; min-width: 220px; padding: 0; cursor: grab; }
  .script:active { cursor: grabbing; }
  .script.drop-on { outline: 3px solid #4c97ff; outline-offset: 6px; }
  .script.dragging { opacity: .55; pointer-events: none; }
  .fly .sb { cursor: grab; margin: 4px 0 8px; }
  .fly .sb-stack { margin-top: 4px; }
  .empty { margin: 8px; color: #fff; font-size: 12px; font-weight: 700; opacity: .85; }
  .drop-slot { height: 6px; margin: 0 10px; border-radius: 6px; }
  body.is-dragging .drop-slot { height: 14px; background: rgba(76,151,255,.18); }
  body.is-dragging .sb input, body.is-dragging .sb select, body.is-dragging .sb-x { pointer-events: none; }
  .drop-slot.drop-on, .sb.drop-on, .sb-mouth.drop-on { background: #ffd500; outline: 2px solid #ffbf00; }
  .sb.drop-on { filter: brightness(1.08); }
  .sb.dragging { opacity: .4; pointer-events: none; }
  .ghost { position: fixed; pointer-events: none; z-index: 80; opacity: .92; margin: 0; max-width: 380px; box-shadow: 0 10px 22px rgba(0,0,0,.28); }
  .script.off-stack { filter: grayscale(1); opacity: .72; }
  .script.off-stack::after { content: "not on a stack"; display: block; margin: 4px 0 0 8px; color: #6d768c; font-size: 11px; font-weight: 700; }
  .reporter {
    display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 0 10px;
    border-radius: 999px; background: #ff8c1a; color: #fff; font-size: 12px; font-weight: 700;
    cursor: grab; user-select: none; touch-action: none; box-shadow: 0 2px 0 rgba(0,0,0,.18);
  }
  .reporter:active { cursor: grabbing; }
  .reporter.dragging { opacity: .4; pointer-events: none; }
  .reporter.bad { filter: grayscale(1); opacity: .5; }
  .socket {
    display: inline-flex; align-items: center; min-height: 26px; min-width: 36px; padding: 2px;
    border-radius: 999px; background: rgba(0,0,0,.25); box-shadow: inset 0 1px 0 rgba(0,0,0,.22);
  }
  .socket:empty::before { content: ""; width: 22px; height: 16px; margin: 0 4px; border-radius: 999px; background: rgba(255,255,255,.28); }
  .socket.drop-on { background: #ffd500; outline: 2px solid #ffbf00; }
  .fly .reporter { margin: 4px 0; align-self: flex-start; }
  @media (max-width: 900px) {
    .tabs { display: flex; }
    .app { grid-template-columns: 1fr; height: calc(100% - 92px); }
    nav.cats, aside.fly, main, aside.code { display: none; }
    body[data-panel="palette"] nav.cats, body[data-panel="palette"] aside.fly,
    body[data-panel="stacks"] main, body[data-panel="code"] aside.code { display: flex; }
    body[data-panel="palette"] nav.cats { flex-direction: row; flex-wrap: wrap; }
    .sb-cat { width: 72px; }
    main { display: block; }
  }
</style>
</head>
<body data-panel="stacks">
<header>
  <div class="mark">B</div>
  <div class="grow">
    <h1>Pack Blocks</h1>
    <p id="notice">Drag variables into the round slots. Blocks snap to the nearest stack when dropped close by.</p>
  </div>
  <div class="trash" id="trash">Drop to delete</div>
  <button class="flag gray" id="undo" type="button">Undo</button>
  <button class="flag" id="copy" type="button">Copy code</button>
  <button class="flag blue" id="save" type="button">Download JS</button>
</header>
<div class="tabs">
  <button data-panel="palette">Blocks</button>
  <button data-panel="stacks" class="on">Scripts</button>
  <button data-panel="code">Code</button>
</div>
<div class="app">
  <nav class="cats" id="cats"></nav>
  <aside class="fly" id="fly"></aside>
  <main id="board"><div class="scripts" id="scripts"></div></main>
  <aside class="code"><p>Generated JavaScript</p><pre id="code"></pre></aside>
</div>
<script>
const HOOKS = [
  ["onUse", "used"], ["onHit", "hit"], ["onBlockUse", "block used"],
  ["onBlockBreak", "block broken"], ["onBlockPlace", "block placed"],
  ["onTick", "held"], ["onProjectileHit", "projectile hits"]
];
const FEATURE_EVENTS = [
  ["onChat", "chat message"], ["onTick", "game tick"],
  ["onPlayerJoin", "player joins"], ["onPlayerLeave", "player leaves"]
];
const SOUNDS = ["pickup", "click", "break", "place", "hit", "hurt", "splash", "swim", "footstep", "lavaPop", "sizzle", "drown", "gasp"];
const PARTICLES = ["smoke", "bubble", "water", "lava", "break"];
const OPS = ["===", "!==", "<", "<=", ">", ">="];
const CATS = [
  ["events", "Events", "#ffbf00"], ["sound", "Sound", "#cf63cf"], ["motion", "Motion", "#4c97ff"],
  ["looks", "World", "#9966ff"], ["sensing", "Sensing", "#5cb1d6"], ["vars", "Variables", "#ff8c1a"],
  ["control", "Control", "#ffab19"], ["myblocks", "My Blocks", "#ff6680"]
];
const VAR_LIST = [
  ["player", "player", ["who", "pos", "value"], null, false],
  ["attackedPlayer", "attacked player", ["who", "pos", "value"], ["onHit", "onProjectileHit"], false],
  ["clickedBy", "clicked by", ["who", "pos", "value"], ["onBlockUse"], false],
  ["senderPlayer", "sender", ["who", "pos", "value"], ["onChat"], false],
  ["joinedPlayer", "joined player", ["who", "value"], ["onPlayerJoin"], false],
  ["leavingPlayer", "leaving player", ["who", "value"], ["onPlayerLeave"], false],
  ["block", "block", ["pos", "value"], ["onUse", "onBlockUse", "onBlockBreak", "onBlockPlace", "onProjectileHit"], false],
  ["hit", "hit", ["pos", "value"], ["onProjectileHit"], false],
  ["event", "event", ["pos", "value"], null, false],
  ["world", "world", ["value"], null, false],
  ["item", "item", ["value"], ["onUse", "onHit", "onBlockUse", "onBlockBreak", "onBlockPlace", "onTick", "onProjectileHit"], true],
  ["xyz", "x y z", ["pos"], null, false]
];
const SNAP_LIMIT = 64;
const AIM_MODES = [["look", "looking"], ["angles", "yaw / pitch"], ["vector", "x y z"]];
const ACTIONS = [
  ["playSound", "play sound", "sound", "#cf63cf"],
  ["particle", "particle", "looks", "#9966ff"],
  ["heal", "heal", "motion", "#4c97ff"],
  ["damage", "damage", "motion", "#4c97ff"],
  ["velocity", "push", "motion", "#4c97ff"],
  ["giveItem", "give item", "looks", "#9966ff"],
  ["setBlock", "set block", "looks", "#9966ff"],
  ["spawnDrop", "drop item", "looks", "#9966ff"],
  ["setTime", "set time", "looks", "#9966ff"],
  ["launch", "launch projectile", "looks", "#9966ff"],
  ["rayIf", "if looking at", "sensing", "#5cb1d6"],
  ["if", "if <> then", "control", "#ffab19"],
  ["repeat", "repeat", "control", "#ffab19"],
  ["returnHit", "hit power", "control", "#ffab19"],
  ["callService", "call", "myblocks", "#ff6680"]
];
const PLAYER_FIELDS = [
  ["name", "name"], ["id", "id"], ["health", "health"], ["dead", "dead"],
  ["position.x", "x"], ["position.y", "y"], ["position.z", "z"],
  ["yaw", "yaw"], ["pitch", "pitch"], ["gameMode", "mode"]
];
const ROOTS = {
  player: { expr: "player", fields: PLAYER_FIELDS },
  attackedPlayer: { expr: "event.attackedPlayer", fields: PLAYER_FIELDS },
  clickedBy: { expr: "event.clickedBy", fields: PLAYER_FIELDS },
  senderPlayer: { expr: "event.senderPlayer", fields: PLAYER_FIELDS },
  joinedPlayer: { expr: "event.joinedPlayer", fields: [["name", "name"], ["id", "id"]] },
  leavingPlayer: { expr: "event.leavingPlayer", fields: [["name", "name"], ["id", "id"]] },
  block: { expr: "block", fields: [
    ["type", "type"], ["id", "id"],
    ["position.x", "x"], ["position.y", "y"], ["position.z", "z"],
    ["face.x", "face x"], ["face.y", "face y"], ["face.z", "face z"]
  ] },
  hit: { expr: "event.hit", fields: [
    ["type", "type"], ["id", "id"],
    ["position.x", "x"], ["position.y", "y"], ["position.z", "z"]
  ] },
  event: { expr: "event", fields: [
    ["type", "type"], ["message", "message"], ["sender", "sender"], ["dt", "tick"],
    ["position.x", "x"], ["position.y", "y"], ["position.z", "z"]
  ] },
  world: { expr: "world", fields: [["time", "time"]] },
  item: { expr: "event.item", fields: [["id", "id"], ["name", "name"], ["kind", "kind"]] }
};
const STR_FIELDS = { name: 1, id: 1, type: 1, message: 1, sender: 1, kind: 1, gameMode: 1 };
const STORE = "ezzycraft-pack-blocks";
let seq = 10;
const uid = (p) => p + (++seq);
let cat = "events";
let drag = null;
let didDrag = false;
let history = [];
let spawnN = 0;
let model = {
  services: [{ id: "svc1", name: "playPickup", x: 36, y: 36, body: [{ id: "s1", kind: "playSound", sound: "pickup" }] }],
  items: [{ id: "item1", key: "magicSword", hooks: [{ id: "hook1", name: "onUse", x: 340, y: 36, body: [
    { id: "s2", kind: "callService", name: "playPickup" },
    { id: "s3", kind: "velocity", x: "0", y: "0.8", z: "0" }
  ] }] }],
  features: [{ id: "feat1", name: "chatListener", event: "onChat", x: 36, y: 280, body: [
    { id: "s4", kind: "if", cmp: { root: "event", field: "message" }, op: "===", right: "hello", then: [
      { id: "s5", kind: "playSound", sound: "pickup" }
    ] }
  ] }],
  loose: []
};

function isC(stmt) { return stmt && (stmt.kind === "if" || stmt.kind === "rayIf" || stmt.kind === "repeat"); }
function actionColor(kind) { return (ACTIONS.find((a) => a[0] === kind) || [,,, "#4c97ff"])[3]; }
function actionLabel(kind) { return (ACTIONS.find((a) => a[0] === kind) || [, kind])[1]; }
function hookLabel(name) { return (HOOKS.find((h) => h[0] === name) || [, name])[1]; }
function clone(value) { return JSON.parse(JSON.stringify(value)); }
function rootMeta(root) { return ROOTS[root] || ROOTS.event; }
function fieldsOf(root) { return rootMeta(root).fields; }
function defaultField(root) { return (fieldsOf(root)[0] || ["name"])[0]; }
function isStrField(field) { const leaf = String(field || "").split(".").pop(); return !!STR_FIELDS[leaf]; }
function isStrRef(ref) {
  if (!ref || !ref.field) return false;
  if (ref.field === "id") return /player|Player|clickedBy/.test(ref.root || "");
  return isStrField(ref.field);
}
function varSpec(root) { return VAR_LIST.find((entry) => entry[0] === root); }
function varLabel(root) { return (varSpec(root) || [, root])[1]; }
function scriptEvent(script) {
  const rec = scriptRecord(script);
  if (!rec) return null;
  if (script.kind === "feature") return rec.event || "onChat";
  if (script.kind === "hook") return rec.name || "onUse";
  if (script.kind === "service") return "service";
  return null;
}
function varFits(root, slot, script) {
  const spec = varSpec(root);
  if (!spec || spec[2].indexOf(slot) < 0) return false;
  if (!script || script.kind === "loose") return false;
  if (spec[4] && script.kind !== "hook") return false;
  if (!spec[3]) return script.kind === "service" || script.kind === "hook" || script.kind === "feature";
  if (script.kind === "service") return false;
  const event = scriptEvent(script);
  return !!event && spec[3].indexOf(event) >= 0;
}

function fresh(kind) {
  const id = uid("s");
  if (kind === "playSound") return { id, kind, sound: "pickup" };
  if (kind === "particle") return { id, kind, particle: "smoke", pos: { root: "player" } };
  if (kind === "heal" || kind === "damage") return { id, kind, amount: "2", who: "player" };
  if (kind === "velocity") return { id, kind, x: "0", y: "0.8", z: "0", who: "player" };
  if (kind === "giveItem") return { id, kind, itemId: "120", count: "1", who: "player" };
  if (kind === "setBlock") return { id, kind, blockId: "1", pos: { root: "block" } };
  if (kind === "spawnDrop") return { id, kind, itemId: "120", count: "1", pos: { root: "player" } };
  if (kind === "setTime") return { id, kind, hours: "12" };
  if (kind === "launch") return { id, kind, speed: "18", lifetime: "4", damage: "3", aim: "look", yaw: "0", pitch: "0", dx: "0", dy: "0", dz: "1" };
  if (kind === "callService") return { id, kind, name: (model.services[0] && model.services[0].name) || "playPickup" };
  if (kind === "returnHit") return { id, kind, damage: "1.5", knockback: "1.2" };
  if (kind === "rayIf") return { id, kind, target: "player", maxDistance: "12", then: [] };
  if (kind === "repeat") return { id, kind, times: "3", then: [] };
  return { id, kind: "if", cmp: { root: "player", field: "health" }, op: "<", right: "10", then: [] };
}

function eachScript(fn) {
  model.services.forEach((s) => fn(s.body, { kind: "service", id: s.id }));
  model.features.forEach((f) => fn(f.body, { kind: "feature", id: f.id }));
  model.items.forEach((item) => item.hooks.forEach((h) => fn(h.body, { kind: "hook", itemId: item.id, hookId: h.id })));
  (model.loose || []).forEach((s) => fn(s.body, { kind: "loose", id: s.id }));
}
function scriptRecord(script) {
  if (!script) return null;
  if (script.kind === "service") return model.services.find((s) => s.id === script.id);
  if (script.kind === "feature") return model.features.find((f) => f.id === script.id);
  if (script.kind === "loose") return (model.loose || []).find((s) => s.id === script.id);
  const item = model.items.find((i) => i.id === script.itemId);
  return item && item.hooks.find((h) => h.id === script.hookId);
}
function scriptBody(script) { return (scriptRecord(script) || {}).body; }
function findInBody(body, id) {
  if (!body) return null;
  for (let i = 0; i < body.length; i++) {
    if (body[i].id === id) return { body, index: i, stmt: body[i] };
    if (isC(body[i])) {
      const nested = findInBody(body[i].then, id);
      if (nested) return nested;
    }
  }
  return null;
}
function locate(id) {
  let found = null;
  eachScript((body, script) => {
    if (found) return;
    const hit = findInBody(body, id);
    if (hit) found = { ...hit, script };
  });
  return found;
}
function containsId(stmt, id) {
  if (!stmt) return false;
  if (stmt.id === id) return true;
  return (stmt.then || []).some((child) => containsId(child, id));
}
function walkBody(body, id, fn) {
  const next = [];
  for (const stmt of body) {
    if (stmt.id === id) { const r = fn(stmt); if (r) next.push(r); continue; }
    next.push(isC(stmt) ? { ...stmt, then: walkBody(stmt.then, id, fn) } : stmt);
  }
  return next;
}
function updateStmt(id, fn) {
  const walk = (body) => walkBody(body, id, fn);
  model.services = model.services.map((s) => ({ ...s, body: walk(s.body) }));
  model.features = model.features.map((f) => ({ ...f, body: walk(f.body) }));
  model.items = model.items.map((item) => ({ ...item, hooks: item.hooks.map((h) => ({ ...h, body: walk(h.body) })) }));
  model.loose = (model.loose || []).map((s) => ({ ...s, body: walk(s.body) }));
  pruneLoose();
}
function takeStmt(id) {
  let taken = null;
  updateStmt(id, (stmt) => { taken = stmt; return null; });
  return taken;
}
function pruneLoose() {
  model.loose = (model.loose || []).filter((s) => s.body && s.body.length);
}
function insertStmt(dest, stmt) {
  const body = scriptBody(dest.script);
  if (!body) return;
  if (dest.place === "start") { body.unshift(stmt); return; }
  if (dest.place === "end") { body.push(stmt); return; }
  const loc = findInBody(body, dest.id);
  if (!loc) { body.push(stmt); return; }
  if (dest.place === "after") loc.body.splice(loc.index + 1, 0, stmt);
  else if (dest.place === "into" && isC(loc.stmt)) loc.stmt.then.push(stmt);
}
function wouldNestInSelf(stmt, dest) {
  if (!isC(stmt)) return false;
  if (dest.place === "into" && (dest.id === stmt.id || containsId(stmt, dest.id))) return true;
  if ((dest.place === "after" || dest.place === "start") && dest.id && containsId(stmt, dest.id)) return true;
  return false;
}

function readSlot(stmt, slot) {
  if (slot === "who") return stmt.who ? { root: stmt.who } : null;
  if (slot === "pos") return stmt.pos && stmt.pos.root ? stmt.pos : null;
  if (slot === "value") return stmt.cmp && stmt.cmp.root ? stmt.cmp : null;
  return null;
}
function writeSlot(stmt, slot, value) {
  if (slot === "who") return { ...stmt, who: value ? value.root : "" };
  if (slot === "pos") return { ...stmt, pos: value };
  if (slot === "value") return { ...stmt, cmp: value ? { root: value.root, field: value.field || defaultField(value.root) } : null };
  return stmt;
}
function slotValue(raw, slot) {
  const value = { root: raw.root, field: raw.field, x: raw.x, y: raw.y, z: raw.z };
  if (slot === "value" && value.root !== "xyz" && !value.field) value.field = defaultField(value.root);
  if (slot === "pos" && value.root === "xyz") {
    value.x = value.x == null ? "0" : value.x;
    value.y = value.y == null ? "0" : value.y;
    value.z = value.z == null ? "0" : value.z;
  }
  return value;
}
function dropVar(snap) {
  if (!drag || drag.type !== "var") return;
  if (!snap || snap.dest.place !== "socket") {
    if (!drag.fromId) { note("Drop the variable into a round slot."); return; }
    snapshot();
    updateStmt(drag.fromId, (stmt) => writeSlot(stmt, drag.fromSlot, null));
    note("Removed the variable.");
    render();
    return;
  }
  const dest = snap.dest;
  const value = slotValue(drag.value, dest.slot);
  if (drag.fromId === dest.id && drag.fromSlot === dest.slot) return;
  snapshot();
  if (drag.fromId) updateStmt(drag.fromId, (stmt) => writeSlot(stmt, drag.fromSlot, null));
  updateStmt(dest.id, (stmt) => writeSlot(stmt, dest.slot, value));
  note(varFits(value.root, dest.slot, dest.script) ? "Passed " + varLabel(value.root) + " into the block." : "That variable is gray because this block cannot use it.");
  render();
}
function dropTrash() {
  if (!drag) return;
  if (drag.type === "var") {
    if (!drag.fromId) { note("Palette variables stay in the list."); return; }
    snapshot();
    updateStmt(drag.fromId, (stmt) => writeSlot(stmt, drag.fromSlot, null));
    note("Removed the variable.");
    render();
    return;
  }
  if (drag.type === "stmt") {
    snapshot();
    takeStmt(drag.id);
    note("Deleted block.");
    render();
  } else if (drag.type === "script") {
    snapshot();
    deleteScript(drag.script);
    note("Deleted stack.");
    render();
  } else note("Palette blocks are not deleted. Drag a stacked block here.");
}
function dropHat(payload, pos, onto) {
  snapshot();
  if (payload.hat === "service") {
    const id = uid("svc");
    model.services.push({ id, name: "newService", x: pos.x, y: pos.y, body: [] });
    note("New My Block. Drop stack blocks under the hat.");
  } else if (payload.hat === "feature") {
    const chosen = payload.event || "onChat";
    const names = { onChat: "chatListener", onTick: "tickHandler", onPlayerJoin: "joinHandler", onPlayerLeave: "leaveHandler" };
    const id = uid("feat");
    model.features.push({ id, name: names[chosen] || "newFeature", event: chosen, x: pos.x, y: pos.y, body: [] });
    note("New feature. Drop blocks under the hat.");
  } else if (payload.hat === "item") {
    const id = uid("item");
    const hookId = uid("hook");
    model.items.push({ id, key: "newItem", hooks: [{ id: hookId, name: "onUse", x: pos.x, y: pos.y, body: [] }] });
    note("New item script. The hat name must match Sprite Studio.");
  } else if (payload.hat === "hook") {
    let item = onto && onto.kind === "hook" ? model.items.find((i) => i.id === onto.itemId) : model.items[0];
    if (!item) {
      const id = uid("item");
      const hookId = uid("hook");
      model.items.push({ id, key: "newItem", hooks: [{ id: hookId, name: payload.hook, x: pos.x, y: pos.y, body: [] }] });
      note("New item hat. Drop blocks onto it.");
    } else {
      const existing = item.hooks.find((hook) => hook.name === payload.hook);
      if (existing) {
        existing.x = pos.x;
        existing.y = pos.y;
        note("That hat is already on the item.");
      } else {
        item.hooks.push({ id: uid("hook"), name: payload.hook, x: pos.x, y: pos.y, body: [] });
        note("Hat added. Drop blocks onto it.");
      }
    }
  }
  document.body.dataset.panel = "stacks";
  render();
}

function setFields(id, patch) {
  updateStmt(id, (cur) => ({ ...cur, ...patch }));
  codeOnly();
  persist();
}
function reporterChip(value, slot, script, stmtId) {
  const bad = !varFits(value.root, slot, script);
  const chip = el("span", {
    class: "reporter" + (bad ? " bad" : ""),
    title: bad ? "This variable does not belong on this block" : ""
  }, [varLabel(value.root)]);
  if (slot === "value" && value.root !== "xyz") {
    const field = value.field || defaultField(value.root);
    chip.append(menu(field, fieldsOf(value.root), (next) => setFields(stmtId, { cmp: { root: value.root, field: next } })));
  }
  if (slot === "pos" && value.root === "xyz") {
    const axis = (key) => (raw) => {
      const found = locate(stmtId);
      const pos = (found && found.stmt.pos) || { root: "xyz", x: "0", y: "0", z: "0" };
      setFields(stmtId, { pos: { ...pos, root: "xyz", [key]: raw } });
    };
    chip.append(bubble(value.x || "0", axis("x")), bubble(value.y || "0", axis("y")), bubble(value.z || "0", axis("z")));
  }
  return bindDrag(chip, {
    type: "var",
    value: { root: value.root, field: value.field, x: value.x, y: value.y, z: value.z },
    fromId: stmtId,
    fromSlot: slot
  }, true);
}
function socketNode(stmt, slot, script) {
  const node = bindDrop(el("span", { class: "socket" }), { place: "socket", slot, id: stmt.id, script });
  const value = readSlot(stmt, slot);
  if (value) node.append(reporterChip(value, slot, script, stmt.id));
  return node;
}
function paintFields(stmt, row, script) {
  if (stmt.kind === "playSound") row.append("play sound", menu(stmt.sound, SOUNDS, (sound) => setFields(stmt.id, { sound })));
  if (stmt.kind === "particle") row.append("particle", menu(stmt.particle, PARTICLES, (particle) => setFields(stmt.id, { particle })), "at", socketNode(stmt, "pos", script));
  if (stmt.kind === "heal") row.append("heal", socketNode(stmt, "who", script), "by", bubble(stmt.amount, (amount) => setFields(stmt.id, { amount })));
  if (stmt.kind === "damage") row.append("damage", socketNode(stmt, "who", script), "by", bubble(stmt.amount, (amount) => setFields(stmt.id, { amount })));
  if (stmt.kind === "velocity") row.append("push", socketNode(stmt, "who", script), "x", bubble(stmt.x, (x) => setFields(stmt.id, { x })), "y", bubble(stmt.y, (y) => setFields(stmt.id, { y })), "z", bubble(stmt.z, (z) => setFields(stmt.id, { z })));
  if (stmt.kind === "giveItem") row.append("give", socketNode(stmt, "who", script), "id", bubble(stmt.itemId, (itemId) => setFields(stmt.id, { itemId })), "×", bubble(stmt.count, (count) => setFields(stmt.id, { count })));
  if (stmt.kind === "setBlock") row.append("set block", bubble(stmt.blockId, (blockId) => setFields(stmt.id, { blockId })), "at", socketNode(stmt, "pos", script));
  if (stmt.kind === "spawnDrop") row.append("drop id", bubble(stmt.itemId, (itemId) => setFields(stmt.id, { itemId })), "×", bubble(stmt.count, (count) => setFields(stmt.id, { count })), "at", socketNode(stmt, "pos", script));
  if (stmt.kind === "setTime") row.append("set time to", bubble(stmt.hours, (hours) => setFields(stmt.id, { hours })), "hours");
  if (stmt.kind === "launch") {
    const aim = stmt.aim || "look";
    row.append("launch speed", bubble(stmt.speed, (speed) => setFields(stmt.id, { speed })), "life", bubble(stmt.lifetime, (lifetime) => setFields(stmt.id, { lifetime })), "dmg", bubble(stmt.damage, (damage) => setFields(stmt.id, { damage })),
      "aim", menu(aim, AIM_MODES, (next) => { setFields(stmt.id, { aim: next }); render(); }));
    if (aim === "angles") row.append("yaw", bubble(stmt.yaw || "0", (yaw) => setFields(stmt.id, { yaw })), "°", "pitch", bubble(stmt.pitch || "0", (pitch) => setFields(stmt.id, { pitch })), "°");
    if (aim === "vector") row.append("x", bubble(stmt.dx || "0", (dx) => setFields(stmt.id, { dx })), "y", bubble(stmt.dy || "0", (dy) => setFields(stmt.id, { dy })), "z", bubble(stmt.dz || "1", (dz) => setFields(stmt.id, { dz })));
  }
  if (stmt.kind === "callService") {
    const names = model.services.map((s) => s.name);
    if (stmt.name && !names.includes(stmt.name)) names.unshift(stmt.name);
    row.append("call", names.length ? menu(stmt.name, names, (name) => setFields(stmt.id, { name })) : bubble(stmt.name, (name) => setFields(stmt.id, { name }), true));
  }
  if (stmt.kind === "returnHit") row.append("hit damage ×", bubble(stmt.damage, (damage) => setFields(stmt.id, { damage })), "knockback ×", bubble(stmt.knockback, (knockback) => setFields(stmt.id, { knockback })));
}
function stmtNode(stmt, script, depth) {
  const color = actionColor(stmt.kind);
  const after = { script, place: "after", id: stmt.id };
  const z = String(40 - depth);
  if (isC(stmt)) {
    const row = bindDrag(el("div", { class: "sb sb-c sb-stack", style: "--sb:" + color + ";z-index:" + z }), { type: "stmt", id: stmt.id }, true);
    bindDrop(row, after);
    const head = el("div", { class: "sb-head" });
    if (stmt.kind === "if") {
      head.append("if", socketNode(stmt, "value", script),
        menu(stmt.op || "===", OPS, (op) => setFields(stmt.id, { op })),
        bubble(stmt.right, (right) => setFields(stmt.id, { right }), "cmp"), "then");
    } else if (stmt.kind === "rayIf") {
      head.append("if looking at", menu(stmt.target, [["player", "player"], ["block", "block"]], (targetType) => setFields(stmt.id, { target: targetType })),
        "within", bubble(stmt.maxDistance, (maxDistance) => setFields(stmt.id, { maxDistance })), "blocks");
    } else head.append("repeat", bubble(stmt.times, (times) => setFields(stmt.id, { times })), "times");
    head.append(xbtn(() => { takeStmt(stmt.id); }));
    row.append(head);
    const mouth = bindDrop(el("div", { class: "sb-mouth" }), { script, place: "into", id: stmt.id });
    if (!stmt.then.length) mouth.append(el("p", { class: "empty" }, ["drop blocks here"]));
    else stmt.then.forEach((child, i) => mouth.append(stmtNode(child, script, i)));
    row.append(mouth, el("div", { class: "sb-foot" }));
    return row;
  }
  const row = bindDrag(el("div", { class: "sb sb-stack", style: "--sb:" + color + ";z-index:" + z }), { type: "stmt", id: stmt.id }, true);
  bindDrop(row, after);
  paintFields(stmt, row, script);
  row.append(xbtn(() => { takeStmt(stmt.id); }));
  return row;
}
function hat(color, kids, script) {
  const row = bindDrop(el("div", { class: "sb sb-hat", style: "--sb:" + color + ";z-index:50" }), { script, place: "start" });
  kids.forEach((kid) => row.append(kid));
  return row;
}
function scriptBox(hatNode, body, script, rec) {
  const box = bindDrag(el("div", { class: "script" + (script.kind === "loose" ? " off-stack" : ""), style: "left:" + (rec.x || 36) + "px;top:" + (rec.y || 36) + "px" }), { type: "script", script });
  bindDrop(box, { script, place: "end" });
  if (hatNode) box.append(hatNode);
  else box.append(slot({ script, place: "start" }));
  body.forEach((stmt, i) => box.append(stmtNode(stmt, script, i)));
  return box;
}

function paletteHat(color, text, payload, onClick) {
  return bindDrag(el("div", { class: "sb sb-hat", style: "--sb:" + color, role: "button", onclick: () => { if (!didDrag) onClick(); } }, [text]), payload);
}
function paletteStack(action) {
  return bindDrag(el("div", { class: "sb sb-stack", style: "--sb:" + action[3], role: "button", onclick: () => {
    if (!didDrag) placeNew(action[0], spawnPos());
  } }, [action[1]]), { type: "palette", kind: action[0] });
}
function paletteVar(entry) {
  return bindDrag(el("div", { class: "reporter", role: "button" }, [entry[1]]), { type: "var", value: { root: entry[0] } });
}

function render() {
  migrate();
  document.body.dataset.panel = document.body.dataset.panel || "stacks";
  const cats = document.getElementById("cats");
  cats.replaceChildren(...CATS.map(([id, labelText, color]) => el("button", {
    class: "sb-cat" + (cat === id ? " on" : ""), style: "background:" + color,
    onclick: () => { cat = id; document.body.dataset.panel = "palette"; document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.panel === "palette")); render(); }
  }, [labelText])));
  const fly = document.getElementById("fly");
  const bits = [el("p", { class: "hint" }, [cat === "vars" ? "Drag into a round slot. Gray means that block cannot use it." : "Drag onto the board or onto a stack"])];
  if (cat === "events") {
    bits.push(paletteHat("#ffbf00", "when item clicked", { type: "hat", hat: "item" }, () => dropHat({ hat: "item" }, spawnPos())));
    HOOKS.forEach(([id, labelText]) => bits.push(paletteHat("#ffbf00", "when " + labelText.toLowerCase(), { type: "hat", hat: "hook", hook: id }, () => dropHat({ hat: "hook", hook: id }, spawnPos()))));
    bits.push(paletteHat("#ff6680", "define my block", { type: "hat", hat: "service" }, () => dropHat({ hat: "service" }, spawnPos())));
    FEATURE_EVENTS.forEach(([id, labelText]) => bits.push(paletteHat("#0fbd8c", "when " + labelText, { type: "hat", hat: "feature", event: id }, () => dropHat({ hat: "feature", event: id }, spawnPos()))));
  }
  if (cat === "vars") VAR_LIST.forEach((entry) => bits.push(paletteVar(entry)));
  ACTIONS.filter((a) => a[2] === cat).forEach((a) => bits.push(paletteStack(a)));
  fly.replaceChildren(...bits);
  const scripts = [];
  model.services.forEach((service) => {
    const script = { kind: "service", id: service.id };
    scripts.push(scriptBox(hat("#ff6680", ["define ", bubble(service.name, (name) => { service.name = name; codeOnly(); persist(); }, true), xbtn(() => { model.services = model.services.filter((s) => s.id !== service.id); })], script), service.body, script, service));
  });
  model.items.forEach((item) => item.hooks.forEach((hook) => {
    const script = { kind: "hook", itemId: item.id, hookId: hook.id };
    scripts.push(scriptBox(hat("#ffbf00", ["when ", bubble(item.key, (key) => { item.key = key; codeOnly(); persist(); }, true), " " + hookLabel(hook.name).toLowerCase(), xbtn(() => {
      item.hooks = item.hooks.filter((h) => h.id !== hook.id);
      model.items = model.items.filter((entry) => entry.hooks.length);
    })], script), hook.body, script, hook));
  }));
  model.features.forEach((feature) => {
    const script = { kind: "feature", id: feature.id };
    scripts.push(scriptBox(hat("#0fbd8c", ["when ", bubble(feature.name, (name) => { feature.name = name; codeOnly(); persist(); }, true), menu(feature.event || "onChat", FEATURE_EVENTS, (event) => { feature.event = event; render(); }), xbtn(() => { model.features = model.features.filter((f) => f.id !== feature.id); })], script), feature.body, script, feature));
  });
  (model.loose || []).forEach((loose) => {
    const script = { kind: "loose", id: loose.id };
    scripts.push(scriptBox(null, loose.body, script, loose));
  });
  const area = document.getElementById("scripts");
  area.replaceChildren(...scripts);
  let w = area.parentElement.clientWidth || 800, h = area.parentElement.clientHeight || 600;
  allPlaced().forEach((rec) => {
    w = Math.max(w, (rec.x || 0) + 420);
    h = Math.max(h, (rec.y || 0) + 420);
  });
  area.style.width = w + "px";
  area.style.height = h + "px";
  codeOnly();
  persist();
}
function codeOnly() { document.getElementById("code").textContent = generate(); persist(); }

bindDrop(document.getElementById("board"), { place: "workspace" });
bindDrop(document.getElementById("trash"), { place: "trash" });
document.querySelectorAll(".tabs button").forEach((button) => button.addEventListener("click", () => {
  document.body.dataset.panel = button.dataset.panel;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b === button));
}));
document.getElementById("undo").addEventListener("click", () => {
  const prev = history.pop();
  if (!prev) { note("Nothing to undo."); return; }
  model = JSON.parse(prev);
  migrate();
  render();
  note("Undid last change.");
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    document.getElementById("undo").click();
  }
});
document.getElementById("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(generate()); note("Copied. Paste it into the pack-wide JavaScript module."); }
  catch { note("Copy was blocked. Use Download JS instead."); }
});
document.getElementById("save").addEventListener("click", () => {
  const blob = new Blob([generate() + "\n"], { type: "text/javascript" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "pack-module.js"; a.click();
  URL.revokeObjectURL(url);
  note("Downloaded pack-module.js. Paste that text into Sprite Studio.");
});
restore();
render();
</script>
